name: tilemath
description: "Tile calculator with fraction-inch keyboard. Fully offline."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  in_app_review: ^2.0.10
  intl: any
  package_info_plus: ^9.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  # 字体来源：google/fonts 仓库（OFL）。Plex Latin 由 VF 实例化出静态权重；
  # Noto Sans SC 为子集（改 app_zh.arb 后重跑 tool/fonts/subset_noto_sc.sh）。
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular-subset.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-SemiBold-subset.ttf
          weight: 600

# app 图标（设计稿 8a·Cut tile 出血版，2026-07-27 定稿）：
# 源图由 tool/icon/make_app_icons.py 生成，改图标先改脚本再重跑。
# 运行：fvm dart run flutter_launcher_icons（跑完 git diff 检查 pbxproj！）
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # iOS 18+ 三外观：深色版带真透明（remove_alpha_ios 只作用于主图，不冲突）
  image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  adaptive_icon_background: "#201E1D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
